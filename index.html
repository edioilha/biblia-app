<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Leitura e estudo da Bíblia, offline." />
    <meta name="theme-color" content="#2c5282" />
    <link rel="icon" href="/biblia-app/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/biblia-app/apple-touch-icon.png" />
    <title>Bíblia App</title>
    <script>
      // UC12 — aplica o tema salvo antes de desenhar a página (sem piscar o claro).
      try {
        const c = JSON.parse(localStorage.getItem('biblia-app:leitura') || 'null');
        if (c && /^(CLARO|SEPIA|ESCURO)$/.test(c.tema)) {
          document.documentElement.dataset.tema = c.tema;
          document.documentElement.style.setProperty(
            '--escala-leitura',
            String(Number(c.escala) || 1),
          );
        }
      } catch {
        // sem localStorage: o React aplica logo em seguida
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
