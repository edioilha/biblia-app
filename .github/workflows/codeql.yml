name: codeql

# BL-16 — análise estática de segurança (CodeQL) do código e dos workflows.
# Os achados aparecem em Security → Code scanning, visíveis só para os mantenedores.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # segundas, 06:23 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analise:
    name: CodeQL (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.linguagem }}
